<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:aqua;
            font-family:Arial, Helvetica, sans-serif;
        }

        nav{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:aqua;
            padding:15px 30px;
        }

        h2{
            font-size:2rem;
        }

        ul{
            display:flex;
            list-style:none;
            gap:20px;
        }

        a{
            text-decoration:none;
            color:black;
            font-weight:bold;
        }

        a:hover{
            color:pink;
        }
        .notification{
            position:relative;
            font-size:2rem;
        }
        .badge{
            position:absolute;
            top:-5px;
            right:-10px;
            width:22px;
            height:22px;
            border-radius:50%;
            background:red;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:14px;
        }
        .container{
            height:80vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login{
            width:350px;
            background:coral;
            color:white;
            padding:35px;
            border-radius:20px;
        }

        .login h3{
            text-align:center;
            margin-bottom:10px;
        }

        .login p{
            text-align:center;
            margin-bottom:25px;
        }

        .login input{
            width:100%;
            padding:12px;
            border-radius:6px;
            border:none;
            outline:none;
            margin-bottom:18px;
        }

        /* Password */

        .password{
            position:relative;
        }

        .password input{
            padding-right:40px;
            margin-bottom:0;
        }

        .tool{
            position:absolute;
            right:15px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
            color:black;
        }

        /* Tooltip */

        .tool-text{
            visibility:hidden;
            opacity:0;

            position:absolute;
            bottom:35px;
            right:-20px;

            background:black;
            color:white;

            padding:8px 10px;
            border-radius:5px;
            font-size:13px;
            white-space:nowrap;

            transition:0.3s;
        }

        .tool:hover .tool-text{
            visibility:visible;
            opacity:1;
        }

        /* Button */

        .btn{
            display:flex;
            justify-content:center;
            margin-top:25px;
        }

        button{
            width:120px;
            padding:10px;
            border:none;
            border-radius:6px;
            background:bisque;
            cursor:pointer;
            font-weight:bold;
        }

        button:hover{
            background:violet;
        }

        .links{
            text-align:center;
            margin-top:20px;
        }

        .links h4{
            margin-top:10px;
            font-weight:normal;
            cursor:pointer;
        }

        .links h4:hover{
            text-decoration:underline;
        }
        .cross{
              position: absolute;
    top: 15px;
    right: 15px;
    cursor: pointer;
    font-size: 20px;
    color: white;
        }
    </style>

</head>
<body>

    <nav>

        <h2>CodeVerse</h2>

        <ul>
            <li><a href="#">HOME</a></li>
            <li><a href="#">ABOUT</a></li>
            <li><a href="#">COURSES</a></li>
        </ul>

        <div class="notification">
            <i class="fa-regular fa-bell fa-shake"></i>
            <span class="badge">5</span>
        </div>

    </nav>

    <section class="container">

        <div class="login">
            <h3>WELCOME BACK</h3>
            <p>Login to Continue</p>

            <input type="email" id="e" placeholder="Email">

            <div class="password">

                <input type="password" id="p" placeholder="Password">

                <span class="tool">

                    <i class="fa-solid fa-circle-question"></i>

                    <span class="tool-text">
                        Minimum 8 characters required
                    </span>

                </span>

            </div>

            <div class="btn">
                <button id="loginbtn">Login</button>
            </div>

            <div>
                <h4><center>Forgot Password?</center></h4>
                <h4><center>Don't have an account? Sign Up</center></h4>
            </div>

        </div>

    </section>

</body>
<script>
    let loginbtn=document.getElementById("loginbtn");
    loginbtn.addEventListener("click",function(){
        let e=document.getElementById("e").value;
    let p=document.getElementById("p").value;
    if(p=="" || e==""){
        alert("Fill all the fields");
    }
    else{
        alert("Successfull");
    }
    });
</script>
</html>
